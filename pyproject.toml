[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecocar-honk"
version = "0.1.0"
description = "Honk classification and Jetson/Pi driver notifications"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
audio = ["numpy>=1.24,<3", "scipy>=1.10,<2", "soundfile>=0.12,<1", "sounddevice>=0.4.6,<1"]
train = ["torch>=2.1,<3", "numpy>=1.24,<3", "scipy>=1.10,<2", "soundfile>=0.12,<1"]
pi = ["gpiozero>=2,<3", "lgpio>=0.2.2; sys_platform == 'linux'"]

[project.scripts]
ecocar-train = "ecocar.train:main"
ecocar-jetson = "ecocar.jetson:main"
ecocar-pi = "ecocar.pi:main"
ecocar-demo = "ecocar.demo:main"

[tool.setuptools.package-data]
ecocar = ["static/*.html"]

[tool.setuptools.packages.find]
include = ["ecocar*"]
